name: Deploy Swagger to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'docs-site/**'
      - 'public/ekuiper-openapi.json'
      - 'scripts/validate-openapi.mjs'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.20.0'

      - name: Validate eKuiper v2.4.1 OpenAPI contract
        run: node scripts/validate-openapi.mjs
      
      - name: Copy latest OpenAPI spec
        run: cp public/ekuiper-openapi.json docs-site/ekuiper-openapi.json

      - name: Verify deployed contract matches canonical contract
        run: cmp public/ekuiper-openapi.json docs-site/ekuiper-openapi.json
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'docs-site'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
